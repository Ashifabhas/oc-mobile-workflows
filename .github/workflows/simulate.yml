name: simulate

on:
  workflow_dispatch:
    inputs:
      apps:
        description: Apps to simulate, space-separated
        default: shopper warehouse courier manager
      duration:
        description: Minutes of flows per app
        default: "30"
      include_failures:
        description: Also run the deliberate-failure flows (errors, slow screens, crashes)
        type: boolean
        default: true
      flows:
        description: Optional regex to pick flows, e.g. journeys/
        default: ""
      api_level:
        description: Android API level of the emulator
        type: choice
        options: ["35", "34", "33"]
        default: "35"
  # The control panel starts runs with event_type "simulate" and the same keys in client_payload.
  repository_dispatch:
    types: [simulate]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
      duration: ${{ steps.plan.outputs.duration }}
      include_failures: ${{ steps.plan.outputs.include_failures }}
      flows: ${{ steps.plan.outputs.flows }}
      api_level: ${{ steps.plan.outputs.api_level }}
    steps:
      - id: plan
        env:
          APPS: ${{ inputs.apps || github.event.client_payload.apps || 'shopper warehouse courier manager' }}
          DURATION: ${{ inputs.duration || github.event.client_payload.duration || '30' }}
          # format() keeps an explicit false, which || would discard.
          INCLUDE_FAILURES_INPUT: ${{ format('{0}', inputs.include_failures) }}
          INCLUDE_FAILURES_PAYLOAD: ${{ format('{0}', github.event.client_payload.include_failures) }}
          FLOWS: ${{ inputs.flows || github.event.client_payload.flows || '' }}
          API_LEVEL: ${{ inputs.api_level || github.event.client_payload.api_level || '35' }}
        run: |
          valid="shopper warehouse courier manager"
          apps=()
          for a in $APPS; do
            [[ " $valid " == *" $a "* ]] || { echo "::error::unknown app '$a' (valid: $valid)"; exit 1; }
            apps+=("$a")
          done
          if ! [[ "$DURATION" =~ ^[0-9]+$ ]] || (( DURATION < 1 || DURATION > 300 )); then
            echo "::error::duration must be 1-300 minutes"; exit 1
          fi
          include="${INCLUDE_FAILURES_INPUT:-${INCLUDE_FAILURES_PAYLOAD:-true}}"
          [[ "$include" == "false" ]] || include=true
          {
            echo "apps=$(printf '%s\n' "${apps[@]}" | jq -R . | jq -sc .)"
            echo "duration=$DURATION"
            echo "include_failures=$include"
            echo "flows=$FLOWS"
            echo "api_level=$API_LEVEL"
          } >> "$GITHUB_OUTPUT"

  android:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    name: android / ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        env:
          MAESTRO_VERSION: 2.11.0
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run flows
        uses: reactivecircus/android-emulator-runner@v2
        env:
          OC_BASE_URL: ${{ vars.OC_BASE_URL || 'https://qa.atatus.com' }}
          MAESTRO_SEED_PASSWORD: ${{ secrets.MAESTRO_SEED_PASSWORD }}
          ATATUS_LICENSE_KEY: ${{ secrets.ATATUS_LICENSE_KEY }}
          ATATUS_ENV: ${{ vars.ATATUS_ENV || 'simulation' }}
          SIM_INCLUDE_FAILURES: ${{ needs.plan.outputs.include_failures }}
          SIM_FLOWS: ${{ needs.plan.outputs.flows }}
          SIM_OUT: ${{ github.workspace }}/out
        with:
          api-level: ${{ needs.plan.outputs.api_level }}
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disk-size: 2048M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics
          disable-animations: true
          script: ./scripts/simulate.sh ${{ matrix.app }} ${{ needs.plan.outputs.duration }}

      - name: Upload Maestro output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-${{ matrix.app }}
          path: out/${{ matrix.app }}
          if-no-files-found: ignore
          retention-days: 7
