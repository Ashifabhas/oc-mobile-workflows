appId: com.atatus.oc.shopper
name: Update the profile
---
- runFlow: ../common/launch.yaml
- runFlow: ../common/login.yaml
- tapOn:
    id: "nav.account"
- tapOn: "Phone"
- eraseText: 20
- inputText: ${'+1415' + Math.floor(Math.random() * 9000000 + 1000000)}
# The iOS phone pad has no Return key, so the keyboard is closed from the name field.
- tapOn: "Full name"
- pressKey: Enter
- tapOn: "Save Changes"
- extendedWaitUntil:
    visible: "Profile updated."
    timeout: 15000
- runFlow: ../common/flush.yaml
