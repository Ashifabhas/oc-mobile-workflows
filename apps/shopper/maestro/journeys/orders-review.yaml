appId: com.atatus.oc.shopper
name: Check an order and review it
---
- runFlow: ../common/launch.yaml
- runFlow: ../common/login.yaml
- tapOn:
    id: "nav.orders"
- extendedWaitUntil:
    visible: "Order #.*"
    timeout: 15000
- tapOn:
    text: "Order #.*"
    index: 0
- extendedWaitUntil:
    visible: "Summary"
    timeout: 15000
- runFlow:
    when:
      visible: "Write a review"
    commands:
      - tapOn: "Write a review"
      - tapOn: ${(Math.floor(Math.random() * 2) + 4) + ' stars'}
      - tapOn: "Title (optional)"
      - inputText: ${['Great value', 'Works as described', 'Would buy again', 'Solid quality'][Math.floor(Math.random() * 4)]}
      - hideKeyboard
      - tapOn: "Submit review"
      - extendedWaitUntil:
          visible: "Thanks for your review!|You have already reviewed this product."
          timeout: 15000
- runFlow: ../common/flush.yaml
