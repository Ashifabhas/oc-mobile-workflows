appId: com.atatus.oc.shopper
name: Browse the catalogue
---
- runFlow: ../common/launch.yaml
- tapOn:
    id: "home.category"
    index: ${Math.floor(Math.random() * 3)}
- extendedWaitUntil:
    visible:
      id: "product.card"
    timeout: 15000
- tapOn:
    id: "product.card"
    index: 0
- extendedWaitUntil:
    visible: "Add to Cart"
    timeout: 15000
# Flutter merges the heading with the review count and sort into one node.
- scrollUntilVisible:
    element: "Customer reviews[\\s\\S]*"
    direction: DOWN
    visibilityPercentage: 50
- back
- tapOn:
    id: "nav.home"
- runFlow: ../common/flush.yaml
