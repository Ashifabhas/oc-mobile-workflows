appId: com.atatus.oc.shopper
---
- launchApp:
    arguments:
      USER_SERVICE_URL: ${MAESTRO_USER_SERVICE_URL}
      PRODUCT_SERVICE_URL: ${MAESTRO_PRODUCT_SERVICE_URL}
      ORDER_SERVICE_URL: ${MAESTRO_ORDER_SERVICE_URL}
      PAYMENT_SERVICE_URL: ${MAESTRO_PAYMENT_SERVICE_URL}
      ANALYTICS_SERVICE_URL: ${MAESTRO_ANALYTICS_SERVICE_URL}
      SHIPPING_SERVICE_URL: ${MAESTRO_SHIPPING_SERVICE_URL}
      REVIEW_SERVICE_URL: ${MAESTRO_REVIEW_SERVICE_URL}
      ATATUS_LICENSE_KEY: ${MAESTRO_ATATUS_LICENSE_KEY}
      ATATUS_SITE: ${MAESTRO_ATATUS_SITE}
      ATATUS_SERVER_URL: ${MAESTRO_ATATUS_SERVER_URL}
      ATATUS_ENV: ${MAESTRO_ATATUS_ENV}
- extendedWaitUntil:
    visible:
      id: "home.ready"
    timeout: 30000
