appId: com.atatus.oc.shopper
---
- evalScript: ${output.shopper = ['divya.krishnan', 'rohan.iyer', 'sana.qureshi', 'vikram.nair'][Math.floor(Math.random() * 4)] + '@observablecommerce.local'}
- evalScript: ${output.signIn = true}
- tapOn:
    id: "nav.account"
- runFlow:
    when:
      true: ${MAESTRO_LONG == 'true'}
      visible:
        id: "account.signout"
    commands:
      - evalScript: ${output.signIn = false}
- runFlow:
    when:
      true: ${MAESTRO_LONG != 'true'}
      visible:
        id: "account.signout"
    commands:
      - scrollUntilVisible:
          element:
            id: "account.signout"
          direction: DOWN
      - tapOn:
          id: "account.signout"
      - extendedWaitUntil:
          visible:
            id: "home.ready"
          timeout: 15000
      - tapOn:
          id: "nav.account"
- runFlow:
    when:
      true: ${output.signIn}
    commands:
      - tapOn:
          id: "account.signin"
      # On iOS typed text is sometimes lost (field not focused yet), so the fill is cleared and retried.
      - retry:
          maxRetries: 2
          commands:
            - tapOn: "Email"
            - eraseText: 60
            - inputText: ${output.shopper}
            - tapOn: "Password"
            - eraseText: 30
            - inputText: ${MAESTRO_SEED_PASSWORD}
            # Enter submits through onFieldSubmitted on both platforms; iOS hideKeyboard presses Return and submits too early.
            - pressKey: Enter
            - extendedWaitUntil:
                visible:
                  id: "account.signout"
                timeout: 20000
- tapOn:
    id: "nav.home"
- extendedWaitUntil:
    visible:
      id: "home.ready"
    timeout: 15000
