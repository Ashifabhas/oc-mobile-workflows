appId: com.atatus.oc.courier
name: Track a parcel by tracking number
---
- runFlow: ../common/launch.yaml
- runFlow: ../common/login.yaml
- tapOn:
    id: "tab.track"
- tapOn:
    id: "track.input"
- inputText: ${['TRKSEED0000000001', 'TRKSEED0000000002', 'TRKSEED0000000003', 'TRKSEED0000000004', 'TRKSEED0000000005', 'TRKSEED0000000006', 'TRKSEED0000000007', 'TRKSEED0000000008', 'TRKSEED0000000009', 'TRKSEED0000000010'][Math.floor(Math.random() * 10)]}
- tapOn:
    id: "track.submit"
- extendedWaitUntil:
    visible:
      id: "track.result|track.notfound|track.error"
    timeout: 20000
- runFlow:
    when:
      visible:
        id: "track.open"
    commands:
      - tapOn:
          id: "track.open"
      - extendedWaitUntil:
          visible:
            id: "shipment.status"
          timeout: 15000
      - tapOn:
          id: "nav.back"
      - extendedWaitUntil:
          visible:
            id: "track.input"
          timeout: 10000
- runFlow: ../common/flush.yaml
