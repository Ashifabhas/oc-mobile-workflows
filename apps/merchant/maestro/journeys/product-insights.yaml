appId: com.atatus.oc.merchant
name: Read a product's views, purchases and ratings
---
- runFlow: ../common/launch.yaml
- runFlow: ../common/login.yaml
- tapOn:
    id: "tab.catalogue"
- extendedWaitUntil:
    visible:
      id: "product.row"
    timeout: 20000
- tapOn:
    id: "product.row"
    index: ${Math.floor(Math.random() * 3)}
- extendedWaitUntil:
    visible:
      id: "product.insights"
    timeout: 15000
- tapOn:
    id: "product.insights"
- extendedWaitUntil:
    visible:
      id: "insights.views|insights.error"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "insights.activity|insights.empty"
    direction: DOWN
    optional: true
- runFlow: ../common/flush.yaml
