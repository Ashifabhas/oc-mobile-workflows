appId: com.atatus.oc.merchant
---
- runFlow: launch.yaml
- runFlow: login.yaml
- tapOn:
    id: "tab.account"
- scrollUntilVisible:
    element:
      id: "account.version"
    direction: DOWN
- longPressOn:
    id: "account.version"
- extendedWaitUntil:
    visible:
      id: "diag.result"
    timeout: 10000
