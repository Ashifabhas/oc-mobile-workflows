appId: com.atatus.oc.warehouse
name: Restock a low-stock item
---
- runFlow: ../common/launch.yaml
- runFlow: ../common/login.yaml
- tapOn:
    id: "tab.low-stock"
- extendedWaitUntil:
    visible:
      id: "lowstock.row|lowstock.empty"
    timeout: 20000
- runFlow:
    when:
      visible:
        id: "lowstock.row"
    commands:
      - tapOn:
          id: "lowstock.row"
          index: ${Math.floor(Math.random() * 3)}
      - extendedWaitUntil:
          visible:
            id: "item.available"
          timeout: 15000
      - tapOn:
          id: "item.receive"
      - tapOn:
          id: "qty.input"
      - eraseText: 5
      - inputText: ${String(Math.floor(Math.random() * 16) + 5)}
      - tapOn:
          id: "qty.confirm"
      - extendedWaitUntil:
          visible:
            id: "item.result"
          timeout: 15000
      - back
- runFlow: ../common/flush.yaml
