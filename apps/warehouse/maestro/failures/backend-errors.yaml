appId: com.atatus.oc.warehouse
name: Backend errors (HTTP 500 and 400)
---
- runFlow: ../common/diagnostics.yaml
- tapOn:
    id: "diag.http_500"
- extendedWaitUntil:
    visible: "Backend error: HTTP 5.*"
    timeout: 15000
- tapOn:
    id: "diag.http_404"
- extendedWaitUntil:
    visible: "Missing item: HTTP 400"
    timeout: 15000
- runFlow: ../common/flush.yaml
