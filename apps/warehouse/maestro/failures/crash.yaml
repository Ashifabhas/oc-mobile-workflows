appId: com.atatus.oc.warehouse
name: App crash
---
- runFlow: ../common/diagnostics.yaml
- scrollUntilVisible:
    element:
      id: "diag.crash"
    direction: DOWN
- tapOn:
    id: "diag.crash"
- assertNotVisible:
    id: "diag.result"
# The SDK uploads a crash report on the next launch, not as the process dies.
- runFlow: ../common/launch.yaml
- runFlow: ../common/flush.yaml
