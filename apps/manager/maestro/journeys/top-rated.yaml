appId: com.atatus.oc.manager
name: Browse top-rated products and open one
---
- runFlow: ../common/launch.yaml
- runFlow: ../common/login.yaml
- tapOn:
    id: "tab.top-rated"
- extendedWaitUntil:
    visible:
      id: "toprated.row|toprated.empty"
    timeout: 20000
- tapOn:
    id: ${'toprated.min.' + ['1', '3', '5'][Math.floor(Math.random() * 3)]}
- extendedWaitUntil:
    visible:
      id: "toprated.row|toprated.empty"
    timeout: 20000
- runFlow:
    when:
      visible:
        id: "toprated.row"
    commands:
      - tapOn:
          id: "toprated.row"
          index: 0
      - extendedWaitUntil:
          visible:
            id: "product.rating"
          timeout: 15000
      - tapOn:
          id: "nav.back"
      - extendedWaitUntil:
          visible:
            id: "toprated.row|toprated.empty"
          timeout: 20000
- runFlow: ../common/flush.yaml
