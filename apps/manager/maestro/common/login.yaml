appId: com.atatus.oc.manager
---
- evalScript: ${output.manager = ['aarav.mehta', 'sana.qureshi', 'vikram.nair'][Math.floor(Math.random() * 3)] + '@observablecommerce.local'}
- runFlow:
    when:
      visible:
        id: "tab.account"
    commands:
      - tapOn:
          id: "tab.account"
      - tapOn:
          id: "account.signout"
- tapOn:
    id: "login.email"
- inputText: ${output.manager}
- tapOn:
    id: "login.password"
- inputText: ${MAESTRO_SEED_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login.submit"
- extendedWaitUntil:
    visible:
      id: "tab.dashboard"
    timeout: 20000
